<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalog & Prices | Amazon Echo</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --accent-cyan: #06b6d4;
            --accent-blue: #3b82f6;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kanit', sans-serif; }
        body { background: var(--bg-color); color: var(--text-main); }
        
        nav { display: flex; justify-content: space-between; padding: 1.2rem 5%; background: rgba(11,15,25,0.8); position: fixed; width: 100%; top: 0; }
        .logo { font-size: 1.5rem; font-weight: 700; background: linear-gradient(90deg, var(--accent-cyan), var(--accent-blue)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-links { display: flex; list-style: none; gap: 20px; }
        .nav-links a { color: var(--text-main); text-decoration: none; }
        .nav-links a.active { color: var(--accent-cyan); }

        .content { padding: 120px 5% 60px; max-width: 1100px; margin: 0 auto; }
        h1 { font-size: 2.2rem; color: var(--accent-cyan); margin-bottom: 30px; text-align: center; }

        .price-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; }
        .price-card {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 30px;
            text-align: center;
        }
        .price { font-size: 2rem; color: var(--accent-cyan); font-weight: 700; margin: 15px 0; }
        .btn-buy {
            display: block;
            width: 100%;
            padding: 10px;
            background: var(--accent-blue);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">AMAZON ECHO 2026</div>
        <ul class="nav-links">
            <li><a href="index.html">หน้าแรก</a></li>
            <li><a href="features.html">นวัตกรรม</a></li>
            <li><a href="products.html" class="active">สินค้า & ราคา</a></li>
        </ul>
    </nav>

    <div class="content">
        <h1>เลือกรุ่นที่ใช่สำหรับคุณ</h1>

        <div class="price-grid">
            <div class="price-card">
                <h3>Amazon Echo Dot Max</h3>
                <p style="color: var(--text-muted);">ลำโพงขนาดเล็ก พลังเสียงแน่น</p>
                <div class="price">฿2,990</div>
                <a href="#" class="btn-buy">สั่งซื้อทันที</a>
            </div>

            <div class="price-card" style="border-color: var(--accent-cyan);">
                <h3>Amazon Echo Futuristic 2026</h3>
                <p style="color: var(--text-muted);">โมเดลลอยตัว AI Ambient Assistant</p>
                <div class="price">฿6,590</div>
                <a href="#" class="btn-buy" style="background: var(--accent-cyan);">สั่งซื้อทันที</a>
            </div>
        </div>
    </div>

</body>
</html>
