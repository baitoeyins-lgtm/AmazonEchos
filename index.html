<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Echo 2026 | Smart Speaker Experience</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- PDF.js Library for Custom Slide Viewer -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        :root {
            --bg-color: #060913;
            --card-bg: rgba(15, 23, 42, 0.85);
            --card-border: rgba(56, 189, 248, 0.25);
            --accent-cyan: #38bdf8;
            --accent-blue: #6366f1;
            --accent-purple: #a855f7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kanit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* Navigation */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 5%;
            background: rgba(6, 9, 19, 0.85);
            backdrop-filter: blur(12px);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 24px;
        }

        .nav-links a {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 400;
            transition: 0.3s;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--accent-cyan);
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }

        /* Hero Section */
        .hero {
            padding: 140px 5% 40px;
            text-align: center;
        }

        .hero h1 {
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
        }

        .hero p {
            color: var(--text-muted);
            max-width: 700px;
            margin: 0 auto 30px;
            font-size: 1.1rem;
        }

        /* Slide Viewer Container */
        .slide-section {
            max-width: 950px;
            margin: 0 auto 60px;
            padding: 0 5%;
        }

        .slide-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            text-align: center;
        }

        .slide-viewer {
            width: 100%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 400px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        #pdf-canvas {
            max-width: 100%;
            height: auto;
            display: block;
        }

        /* Slide Controls */
        .slide-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding: 0 10px;
        }

        .btn-slide {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            color: #fff;
            border: none;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
        }

        .btn-slide:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.5);
        }

        .btn-slide:disabled {
            background: #334155;
            color: #64748b;
            cursor: not-allowed;
            box-shadow: none;
        }

        .page-info {
            font-size: 1.1rem;
            color: var(--text-main);
            font-weight: 500;
        }

        .page-info span {
            color: var(--accent-cyan);
            font-weight: 600;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: var(--text-muted);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- Navigation -->
    <nav>
        <div class="logo">AMAZON ECHO 2026</div>
        <ul class="nav-links">
            <li><a href="index.html" class="active">หน้าแรก</a></li>
            <li><a href="features.html">นวัตกรรม</a></li>
            <li><a href="products.html">สินค้า & ราคา</a></li>
        </ul>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <h1>สัมผัสประสบการณ์ Amazon Echo</h1>
        <p>การนำเสนอรายงานนวัตกรรมลำโพงอัจฉริยะและระบบนิเวศปัญญาประดิษฐ์ (AI Presentation)</p>
    </section>

    <!-- Interactive Slide Presentation Section -->
    <section class="slide-section">
        <div class="slide-card">
            <div class="slide-viewer">
                <canvas id="pdf-canvas"></canvas>
            </div>

            <!-- Slide Navigation Buttons -->
            <div class="slide-controls">
                <button class="btn-slide" id="prev-btn">❮ หน้าก่อนหน้า</button>
                <div class="page-info">
                    หน้า <span id="page-num">1</span> / <span id="page-count">--</span>
                </div>
                <button class="btn-slide" id="next-btn">หน้าถัดไป ❯</button>
            </div>
        </div>
    </section>

    <footer>
        <p>© 2026 GE931 Introduction to Artificial Intelligence Project</p>
        <p style="font-size: 0.8rem; margin-top: 5px; color: var(--accent-cyan);">Prepared by Suthatta Thanagard (2610717302036)</p>
    </footer>

    <!-- PDF.js Interactive Script -->
    <script>
        // PDF File Path
        const url = 'AmazonEcho_Presentation.pdf';

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        let pdfDoc = null,
            pageNum = 1,
            pageIsRendering = false,
            pageNumIsPending = null;

        const canvas = document.getElementById('pdf-canvas'),
              ctx = canvas.getContext('2d');

        // Render Slide Page
        const renderPage = num => {
            pageIsRendering = true;

            pdfDoc.getPage(num).then(page => {
                // Set scale based on screen width
                const viewport = page.getViewport({ scale: 1.5 });
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                const renderCtx = {
                    canvasContext: ctx,
                    viewport: viewport
                };

                page.render(renderCtx).promise.then(() => {
                    pageIsRendering = false;

                    if (pageNumIsPending !== null) {
                        renderPage(pageNumIsPending);
                        pageNumIsPending = null;
                    }
                });

                // Update Page Numbers & Button States
                document.getElementById('page-num').textContent = num;
                document.getElementById('prev-btn').disabled = (num <= 1);
                document.getElementById('next-btn').disabled = (num >= pdfDoc.numPages);
            });
        };

        const queueRenderPage = num => {
            if (pageIsRendering) {
                pageNumIsPending = num;
            } else {
                renderPage(num);
            }
        };

        // Button Click Handlers
        document.getElementById('prev-btn').addEventListener('click', () => {
            if (pageNum <= 1) return;
            pageNum--;
            queueRenderPage(pageNum);
        });

        document.getElementById('next-btn').addEventListener('click', () => {
            if (pageNum >= pdfDoc.numPages) return;
            pageNum++;
            queueRenderPage(pageNum);
        });

        // Load PDF Document
        pdfjsLib.getDocument(url).promise.then(pdfDoc_ => {
            pdfDoc = pdfDoc_;
            document.getElementById('page-count').textContent = pdfDoc.numPages;
            renderPage(pageNum);
        }).catch(err => {
            console.error('Error loading PDF: ', err);
            document.querySelector('.slide-viewer').innerHTML = '<p style="color:#ef4444; padding:20px;">ไม่สามารถโหลดไฟล์พรีเซนชันได้ กรุณาตรวจสอบว่ามีไฟล์ AmazonEcho_Presentation.pdf อยู่ในระบบ</p>';
        });
    </script>
</body>
</html>
